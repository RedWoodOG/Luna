[workspace]
resolver = "2"
members = [
  "crates/luna-core",
  "crates/luna-events",
  "crates/luna-extract",
  "crates/luna-ledger",
  "crates/luna-node",
  "crates/luna-tether",
  "crates/luna-genesis",
  "crates/luna-replay",
  "crates/luna-tests",
  "crates/luna-tcf",
  "crates/luna-recall",
  "crates/luna-runtime",
  "crates/luna-store",
  "crates/luna-metrics",
  "crates/luna-bench",
  "crates/luna-cli"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
